# CI: verifies pushes to main and every pull request with the same checks as
# `npm run check`, audits dependencies, then proves the static export builds.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer run on the same ref makes an older one pointless, so cancel it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Forbidden patterns check
        run: npm run check:forbidden

      - name: Unit tests
        run: npm run test

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      # Dev tooling advisories are reported for visibility but never fail the build.
      - name: Full audit (report only)
        continue-on-error: true
        run: npm audit

      - name: Build static export
        run: npm run build

      # Fails if the router's page-data files are missing from out/ (see tests/export).
      - name: Check exported page-data files
        run: npm run test:export
