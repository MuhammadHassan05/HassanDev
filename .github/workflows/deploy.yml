# Deploy: builds the static export on every push to main and publishes it to
# GitHub Pages. Builds run on Ubuntu, which also avoids the Windows-only
# Next.js page-data bug described in the README.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read

# One group for every deploy, never cancelled: a deploy that has started
# always finishes, and the next push waits its turn instead of racing it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static export
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # configure-pages only reads the repository's Pages settings.
      pages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # Fails early, before building, if Pages is not set to deploy from Actions.
      - name: Check Pages configuration
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npx next build

      - name: Add Content Security Policy
        run: node scripts/csp.mjs out

      # Never publish a page whose CSP, links or page-data files are wrong.
      - name: Check exported files
        run: npm run test:export

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: out
          # .nojekyll starts with a dot, and dotfiles are left out by default.
          include-hidden-files: true

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The only job that can publish: deploy-pages needs both of these.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
